version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: educonnect-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./api/educonnect_db.sqlite
      - DB_ECHO=False
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - UPLOAD_DIR=./api/uploads
      - MAX_UPLOAD_SIZE=5242880
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=INFO
    volumes:
      - ./api/uploads:/app/api/uploads
      - ./api/educonnect_db.sqlite:/app/api/educonnect_db.sqlite
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - educonnect-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: educonnect-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - educonnect-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  educonnect-network:
    driver: bridge

volumes:
  uploads:
  database:
